name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBD-Tournament-Overlay-Windows
          path: dist/DBD-Tournament-Overlay-Setup-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DBD Tournament Overlay ${{ github.ref_name }}
          body: |
            Primeira versão pública do DBD Tournament Overlay para Windows.

            - Painel local
            - URL pronta para Fonte de Navegador do OBS
            - 24 estilos de overlay
            - Sem Node.js separado e sem terminal aberto
            - Servidor acessível somente neste computador (127.0.0.1)
          files: dist/DBD-Tournament-Overlay-Setup-*.exe
